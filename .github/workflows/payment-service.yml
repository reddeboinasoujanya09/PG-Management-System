name: Payment Service Pipeline

on:
  pull_request:
    branches: [master]
    paths:
      - 'paymentService/**'
      - 'common/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: paymentService

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            exit 1
          fi