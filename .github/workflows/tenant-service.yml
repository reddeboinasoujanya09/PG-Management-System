name: Tenant Service Pipeline

on:
  pull_request:
    branches: [Master]
    paths:
      - 'tenantService/**'
      - 'common/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tenantService

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pg_management_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: pass@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d pg_management_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build (Maven or Gradle)
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo "No build tool found"
            exit 1
          fi