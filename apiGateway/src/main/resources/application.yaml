spring:
  application:
    name: apiGateway
  cloud:
    gateway:
      routes:

        - id: tenant-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/tenants/**

        - id: room-service
          uri: http://localhost:3001
          predicates:
            - Path=/api/v1/rooms/**

        - id: booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bookings/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**

        - id: notification-service
          uri: http://localhost:3002
          predicates:
            - Path=/api/v1/notifications/**

server:
  port: 8080